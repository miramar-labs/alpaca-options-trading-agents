name: Model Badge

# Refreshes the README's "Dealer LLM" badge (badges/model.json) from config.yaml's llm.model
# field whenever it changes on main (src/model_badge/main.py). Rendered by shields.io fetching
# that file from raw.githubusercontent.com at view time, same mechanism as the P/L badges
# (see pl-badges.yaml) -- no publicly-reachable service needed.

on:
  push:
    branches: [main]
    paths:
      - config.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  model-badge:
    runs-on: [self-hosted, dgx]
    steps:
      - uses: actions/checkout@v4

      - name: Set up virtualenv
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install --upgrade pip
          .venv-ci/bin/pip install -r requirements.txt

      - name: Generate model badge
        run: .venv-ci/bin/python -m src.model_badge.main

      - name: Commit refreshed badge
        run: |
          if git diff --quiet -- badges/model.json; then
            echo "No model change -- skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/model.json
          git commit -m "Update model badge [skip ci]"
          git push

      - name: Clean up virtualenv
        if: always()
        run: rm -rf .venv-ci

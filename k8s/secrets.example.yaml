# EXAMPLE ONLY — do not apply this file. Create the real secret manually with:
#   kubectl create secret generic mlabs-api-keys -n alpaca-options-trader \
#     --from-literal=ALPACA_PAPER_API_KEY=<competition $100k paper account key> \
#     --from-literal=ALPACA_PAPER_API_SECRET=<competition $100k paper account secret> \
#     --from-literal=TAAPI_API_KEY=... \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=SLACK_WEBHOOK_URL2=... \
#     --from-literal=LANGCHAIN_API_KEY=... \
#     --from-literal=FINNHUB_API_KEY=...
# DATABASE_URL comes from miramar-platform-gcp's deploy-postgres.yaml workflow
# (per-consumer provisioning output) -- see dgx/k3s/postgres/README.md there.
# Never commit real values, and no workflow applies this file automatically.
#
# The whole floor -- stocks and options -- trades on one "live" paper account, named by
# config.yaml's `alpaca.live.key_env`/`secret_env` (see src/common/alpaca_client.py). For this
# repo that is the plain ALPACA_PAPER_API_KEY/ALPACA_PAPER_API_SECRET pair = the competition
# account directly. To point it at a different account at runtime, add that account's key/secret
# under its own distinct name here first, e.g.:
#     --from-literal=ALPACA_PAPER_API_KEY_ALT=... \
#     --from-literal=ALPACA_PAPER_API_SECRET_ALT=...
# then restart the affected pod(s) once so the new env vars are present (env var *values* are
# fixed at pod start). After that, switching is a config.yaml edit alone -- point
# alpaca.live.key_env/secret_env at the new names -- picked up within config's normal 60s
# refresh, no redeploy.
# `kubectl edit secret mlabs-api-keys -n alpaca-options-trader` adds a key to the existing secret
# without recreating it (same shape as `stringData` below).
apiVersion: v1
kind: Secret
metadata:
  name: mlabs-api-keys
  namespace: alpaca-options-trader
type: Opaque
stringData:
  ALPACA_PAPER_API_KEY: "REPLACE_ME"
  ALPACA_PAPER_API_SECRET: "REPLACE_ME"
  TAAPI_API_KEY: "REPLACE_ME"
  DATABASE_URL: "REPLACE_ME"
  SLACK_WEBHOOK_URL2: "REPLACE_ME"
  LANGCHAIN_API_KEY: "REPLACE_ME"
  FINNHUB_API_KEY: "REPLACE_ME"
  # Optional: fine-grained token with Actions:write on this repo. If present, EOD Report
  # dispatches .github/workflows/pl-badges.yaml the instant the Slack recap posts instead of
  # waiting for that workflow's cron. Omit it and the cron still refreshes the badges.
  GITHUB_WORKFLOW_TOKEN: "REPLACE_ME"
